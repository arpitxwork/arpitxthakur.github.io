<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arpit Thakur — Immersive Portfolio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#e8d9c5;color:#202433;font-family:Arial,sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;font-weight:700}
.hero{position:absolute;left:7vw;top:25vh;max-width:720px}
.kicker{font-size:11px;letter-spacing:.18em;opacity:.55}
h1{font-size:clamp(48px,8vw,110px);line-height:.86;letter-spacing:-.065em;margin:18px 0}
h1 span{opacity:.42}
.copy{max-width:420px;font-size:15px;line-height:1.55;opacity:.7}
.archive{position:absolute;right:24px;bottom:24px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.archive button{border:0;background:transparent;font-size:11px;letter-spacing:.1em;cursor:pointer;color:#202433;opacity:.6}
.archive button:hover{opacity:1}
.status{position:absolute;right:24px;top:78px;font-size:10px;letter-spacing:.14em;opacity:.45}
.scroll{position:absolute;bottom:25px;left:7vw;font-size:10px;letter-spacing:.18em;opacity:.5}
@media(max-width:700px){
.top{left:16px;right:16px;top:17px}.top .role{display:none}
.hero{left:18px;right:18px;top:21vh}
h1{font-size:15vw}
.copy{font-size:14px;max-width:300px}
.archive{right:16px;bottom:17px}.scroll{left:18px;bottom:18px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="ui">
 <div class="top"><div>ARPIT THAKUR</div><div class="role">DIGITAL DESIGNER & WEB CREATOR</div></div>
 <div class="hero"><div class="kicker">01 / INTRODUCTION</div><h1>I BUILD<br><span>DIGITAL EXPERIENCES.</span></h1><div class="copy">Websites, identities, posters and visual systems designed to make brands feel memorable.</div></div>
 <div class="status" id="status">THE PERSON BEHIND THE WORK</div>
 <div class="scroll">SCROLL TO EXPLORE</div>
 <div class="archive">
  <button>WEBSITES</button><button>LOGOS</button><button>POSTERS</button><button>VIDEOS</button><button>SOCIAL</button><button>PRODUCTS</button>
 </div>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe8d9c5);
scene.fog=new THREE.Fog(0xe8d9c5,10,30);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
camera.position.set(0,3.5,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.querySelector("#app").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffead0,0x37445d,2.2));
const sun=new THREE.DirectionalLight(0xffb87e,3.3);
sun.position.set(-6,10,5);sun.castShadow=true;scene.add(sun);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const cream=M(0xe8d8bb), blue=M(0x719bd0), navy=M(0x27395e),
skin=M(0xc98e6e), hair=M(0x20202a), sandal=M(0x574235),
concrete=M(0xb8a894), coral=M(0xc87968), green=M(0x6f8066);

function box(w,h,d,m,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
box(30,.35,30,M(0xd2bfa6),0,-.2,0);
box(7,5,.45,concrete,-5,2.3,-2.5);
box(4,3,.45,concrete,5,1.4,-4);
for(let i=0;i<4;i++)box(.55,.12,1.2,coral,-4.1+i*1.05,1.5,-2.18);

for(const x of [-7,7]){
 box(1.5,.75,1.5,M(0xa97961),x,.2,-1);
 for(let i=0;i<5;i++){
  const leaf=new THREE.Mesh(new THREE.CylinderGeometry(.08,.18,1.4,16),green);
  leaf.position.set(x+(i-2)*.2,.95,-1+(i%2)*.15);leaf.rotation.z=(i-2)*.15;leaf.castShadow=true;scene.add(leaf);
 }
}

// Character prototype with the finalized proportions/colors.
const c=new THREE.Group();c.position.set(1,0,1);scene.add(c);
function add(o){o.castShadow=true;c.add(o);return o}

add(Object.assign(new THREE.Mesh(new THREE.CapsuleGeometry(.72,1.25,8,16),blue),{position:new THREE.Vector3(0,3.25,0),scale:new THREE.Vector3(1,.98,.62)}));
for(let i=-2;i<=2;i++){const s=add(new THREE.Mesh(new THREE.BoxGeometry(.035,1.75,.95),navy));s.position.set(i*.22,3.3,.48)}
add(new THREE.Mesh(new THREE.SphereGeometry(.62,32,20),skin)).position.set(0,4.8,0);
const head=c.children[c.children.length-1];head.scale.set(.93,1.08,.9);
const hc=add(new THREE.Mesh(new THREE.SphereGeometry(.65,32,16,0,Math.PI*2,0,Math.PI*.55),hair));hc.position.set(0,5.15,-.02);
const bd=add(new THREE.Mesh(new THREE.SphereGeometry(.47,24,12,0,Math.PI*2,.7,1),hair));bd.position.set(0,4.55,.48);bd.scale.set(.8,.7,.4);

for(const x of [-.34,.34]){
 const l=add(new THREE.Mesh(new THREE.CapsuleGeometry(.23,1.35,6,12),cream));l.position.set(x,1.45,0);
 const f=add(new THREE.Mesh(new THREE.BoxGeometry(.42,.12,.78),sandal));f.position.set(x,.35,.16);
}
for(const x of [-.92,.92]){
 const a=add(new THREE.Mesh(new THREE.CapsuleGeometry(.18,1.2,6,12),blue));a.position.set(x,3.25,0);a.rotation.z=x<0?-.15:.15;
}

// Pointer interaction: restrained, no arrows.
let tx=0,ty=0;
addEventListener("pointermove",e=>{tx=(e.clientX/innerWidth-.5)*.22;ty=(e.clientY/innerHeight-.5)*.12});
const status=document.querySelector("#status");
document.querySelectorAll(".archive button").forEach(b=>b.onclick=()=>{
 status.textContent="ARCHIVE / "+b.textContent;
});

let t=0;
function loop(){
 requestAnimationFrame(loop);t+=.016;
 c.position.y=Math.sin(t*1.25)*.025;
 c.rotation.y+=(tx-c.rotation.y)*.045;
 camera.position.x+=(tx*3-camera.position.x)*.025;
 camera.position.y+=(3.5-ty-camera.position.y)*.025;
 camera.lookAt(0,2.65,0);
 renderer.render(scene,camera);
}
loop();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
