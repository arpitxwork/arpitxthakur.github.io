<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arpit Thakur — Digital Designer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17151a;color:#f8f3e8;font-family:Arial,sans-serif}
#app{position:fixed;inset:0}canvas{display:block}.ui{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;left:5vw;right:5vw;top:4vh;display:flex;justify-content:space-between}
.brand{font-size:12px;letter-spacing:.22em;font-weight:bold}.meta{font-size:10px;letter-spacing:.16em;text-align:right;opacity:.65}
.hero{position:absolute;left:5vw;bottom:9vh}.kicker{font-size:10px;letter-spacing:.2em;opacity:.6;margin-bottom:14px}
h1{font-size:clamp(44px,8vw,112px);line-height:.88;letter-spacing:-.06em;margin:0;font-weight:600}
.sub{margin-top:20px;font-size:13px;line-height:1.5;max-width:420px;opacity:.7}
.project{position:absolute;right:5vw;bottom:20vh;text-align:right;opacity:0;transition:.4s}.project.active{opacity:1}
.project small{font-size:9px;letter-spacing:.18em;opacity:.6}.project h2{font-size:23px;margin:7px 0}
.progress{position:absolute;right:5vw;bottom:8vh;width:110px}.line{height:1px;background:#ffffff40}.fill{height:100%;width:0;background:#fff}
.label{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.15em;margin-top:7px;opacity:.55}
.hint{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);font-size:8px;letter-spacing:.18em;opacity:.4}
</style></head>
<body><div id="app"></div><div class="ui">
<div class="top"><div class="brand">ARPIT THAKUR</div><div class="meta">DIGITAL DESIGNER<br>WEB CREATOR</div></div>
<div class="hero"><div class="kicker">IMMERSIVE PORTFOLIO</div><h1>I BUILD<br>DIGITAL<br>EXPERIENCES.</h1><div class="sub">Scroll to revolve around the character. The camera becomes the navigation.</div></div>
<div class="project" id="project"><small id="ptype"></small><h2 id="pname"></h2></div>
<div class="progress"><div class="line"><div class="fill" id="fill"></div></div><div class="label"><span id="count">01</span><span>SCROLL</span></div></div>
<div class="hint">SCROLL / DRAG TO REVOLVE</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17151a);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
const world=new THREE.Group();scene.add(world);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
let g=new THREE.Mesh(new THREE.CircleGeometry(9,64),mat(0x9a776d));g.rotation.x=-Math.PI/2;world.add(g);
function box(x,y,z,a,b,c,col){let m=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),mat(col));m.position.set(x,y,z);world.add(m)}
box(-5,1.8,-2,2.2,3.6,1.2,0xa9786f);box(4,2.2,-3,1.8,4.4,1.4,0x7f5f68);box(-3,1,-5,4,.5,2,0x745a57);box(4,.7,1,3,.45,1.6,0xb18a72);
for(let i=0;i<14;i++){let a=i/14*Math.PI*2,r=5.8;box(Math.cos(a)*r,.65,Math.sin(a)*r,.12,1.3,.12,0x493a38);let c=new THREE.Mesh(new THREE.SphereGeometry(.75,12,8),mat(0x52604b));c.position.set(Math.cos(a)*r,1.55,Math.sin(a)*r);world.add(c)}
const character=new THREE.Group();world.add(character);
function part(geo,m,p){let x=new THREE.Mesh(geo,m);x.position.set(...p);character.add(x)}
part(new THREE.SphereGeometry(.36,16,12),mat(0x9d6f55),[0,2.45,0]);
part(new THREE.BoxGeometry(1.15,1.25,.58),mat(0x4d78a8),[0,1.65,0]);
part(new THREE.BoxGeometry(.92,.65,.5),mat(0xd9cfb9),[0,.75,0]);
part(new THREE.CylinderGeometry(.16,.19,1.15,8),mat(0xd9cfb9),[-.27,.05,0]);
part(new THREE.CylinderGeometry(.16,.19,1.15,8),mat(0xd9cfb9),[.27,.05,0]);
part(new THREE.BoxGeometry(.42,.12,.7),mat(0x262329),[-.27,-.56,.03]);
part(new THREE.BoxGeometry(.42,.12,.7),mat(0x262329),[.27,-.56,.03]);
part(new THREE.SphereGeometry(.39,16,12),mat(0x262329),[0,2.82,-.02]);
const key=new THREE.DirectionalLight(0xffd4a0,2.2);key.position.set(-4,8,5);scene.add(key);scene.add(new THREE.HemisphereLight(0x9aa9d0,0x4b3030,1.4));
let target=0,angle=0;let drag=false,last=0;
const projects=[["01 / WEBSITE · UI/UX","SHUBHAM HEALTHCARE"],["02 / E-COMMERCE · BRAND","REPLICA RACK"],["03 / LOGOS · IDENTITY","CREATIVE ARCHIVE"],["04 / POSTERS · SOCIAL","VISUAL WORK"],["05 / PRODUCTS · CONTENT","PRODUCT CREATIVES"]];
function updateLabel(){let i=Math.min(projects.length-1,Math.floor((((target%(Math.PI*2))+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*projects.length));document.getElementById("ptype").textContent=projects[i][0];document.getElementById("pname").textContent=projects[i][1];document.getElementById("count").textContent=String(i+1).padStart(2,"0");document.getElementById("project").classList.add("active")}
updateLabel();
addEventListener("wheel",e=>{target+=e.deltaY*.003;updateLabel()},{passive:true});
addEventListener("pointerdown",e=>{drag=true;last=e.clientX});addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{if(drag){target+=(e.clientX-last)*-.008;last=e.clientX;updateLabel()}});
function loop(){requestAnimationFrame(loop);angle+=(target-angle)*.055;camera.position.set(Math.sin(angle)*7.2,3.15,Math.cos(angle)*7.2);camera.lookAt(0,1.55,0);character.rotation.y=-angle+Math.PI;document.getElementById("fill").style.width=((Math.abs(angle)%(Math.PI*2))/(Math.PI*2)*100)+"%";renderer.render(scene,camera)}loop();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
